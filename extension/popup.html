<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 310px;
      padding: 16px;
      background: #080c14;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.15);
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: #0f172a;
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00f0ff;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }
    .title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffffff;
    }
    .title span {
      color: #00f0ff;
    }
    .subtitle {
      font-size: 9px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 1px;
    }

    /* Toggle Card */
    .toggle-card {
      background: #0d1322;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .toggle-card.active {
      border-color: rgba(0, 240, 255, 0.3);
      background: rgba(0, 240, 255, 0.03);
    }
    .toggle-card.paused {
      border-color: rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.03);
    }
    .toggle-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .toggle-label-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
      transition: all 0.2s ease;
    }
    .status-dot.paused {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    .toggle-title {
      font-size: 11px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .toggle-desc {
      font-size: 10px;
      color: #64748b;
      line-height: 1.3;
    }

    /* Switch Component */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: .25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #94a3b8;
      transition: .25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: rgba(0, 240, 255, 0.18);
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.35);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: #00f0ff;
      box-shadow: 0 0 6px #00f0ff;
    }

    /* Due Card */
    .card {
      background: #0d1322;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: center;
    }
    .due-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: #00f0ff;
      line-height: 1;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }
    .due-label {
      font-size: 9px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Action Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 7px;
      transition: all 0.18s ease;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 0.03em;
    }
    .btn-primary {
      background: #00f0ff;
      color: #05070c;
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
    }
    .btn-primary:hover {
      background: #38bdf8;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      border-color: rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(0, 240, 255, 0.3);
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-left">
      <div class="logo">⚡</div>
      <div>
        <div class="title">PACED<span>_LEARNER</span></div>
        <div class="subtitle">FSRS CORE TELEMETRY</div>
      </div>
    </div>
  </div>

  <!-- Extension Master Toggle -->
  <div class="toggle-card active" id="toggle-card">
    <div class="toggle-info">
      <div class="toggle-label-row">
        <div class="status-dot" id="status-dot"></div>
        <span class="toggle-title" id="status-title">WATCHER: ACTIVE</span>
      </div>
      <div class="toggle-desc" id="status-desc">
        Tracking LeetCode solve times & submissions
      </div>
    </div>
    <label class="switch" title="Toggle LeetCode watcher on or off">
      <input type="checkbox" id="extension-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Auto-Log on Solved Toggle -->
  <div class="toggle-card active" id="autolog-card" style="padding: 10px 14px; margin-bottom: 12px;">
    <div class="toggle-info">
      <div class="toggle-label-row">
        <span style="font-size: 11px;">⚡</span>
        <span class="toggle-title" id="autolog-title" style="font-size: 10px;">AUTO-LOG: ON</span>
      </div>
      <div class="toggle-desc" id="autolog-desc" style="font-size: 9.5px;">
        Instant background sync on Accepted without popup
      </div>
    </div>
    <label class="switch" title="Toggle instant auto-logging on Accepted">
      <input type="checkbox" id="autolog-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Due Reviews Today -->
  <div class="card">
    <div class="due-number" id="due-count">...</div>
    <div class="due-label">RECALL QUEUE TODAY</div>
  </div>

  <button class="btn btn-primary" id="open-hub-btn">
    LAUNCH RECALL TERMINAL
  </button>

  <button class="btn btn-secondary" id="open-leetcode-btn">
    BROWSE LEETCODE
  </button>

  <script src="popup.js"></script>
</body>
</html>
