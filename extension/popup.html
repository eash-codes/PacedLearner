<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --text: #000000;
      --border: #000000;
      --sunken: #F4F4F4;
      --muted: #555555;
      --header-bg: #000000;
      --header-text: #FFFFFF;
    }

    body.dark-mode {
      --bg: #000000;
      --text: #FFFFFF;
      --border: #FFFFFF;
      --sunken: #141414;
      --muted: #BBBBBB;
      --header-bg: #FFFFFF;
      --header-text: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      border: 4px solid var(--border);
      user-select: none;
    }

    /* Top Header Bar */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--header-bg);
      color: var(--header-text);
      border-bottom: 3px solid var(--border);
    }
    .title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 14px;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--header-text);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      font-size: 9px;
      color: var(--header-text);
      opacity: 0.8;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .theme-toggle-btn {
      background: transparent;
      color: var(--header-text);
      border: 1.5px solid var(--header-text);
      padding: 2px 7px;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .theme-toggle-btn:hover {
      background: var(--header-text);
      color: var(--header-bg);
    }

    /* Interactive Pacey Stage Card */
    .pacey-hero {
      display: flex;
      align-items: stretch;
      border-bottom: 3px solid var(--border);
      background: var(--bg);
    }
    .pacey-avatar-cell {
      width: 108px;
      min-height: 104px;
      border-right: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      background: var(--bg);
      flex-shrink: 0;
    }
    .corner-tick {
      position: absolute;
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      color: var(--text);
      opacity: 0.45;
      pointer-events: none;
    }
    .tick-tl { top: 4px; left: 6px; }
    .tick-tr { top: 4px; right: 6px; }
    .tick-bl { bottom: 4px; left: 6px; }
    .tick-br { bottom: 4px; right: 6px; }

    .pacey-readout-cell {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--sunken);
    }
    .pacey-badge {
      display: inline-block;
      align-self: flex-start;
      background: var(--text);
      color: var(--bg);
      font-family: 'Archivo Black', sans-serif;
      font-size: 9.5px;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      text-transform: uppercase;
    }
    .pacey-msg {
      font-family: 'Space Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      margin-top: 6px;
    }
    .pacey-hint {
      font-family: 'Space Mono', monospace;
      font-size: 8.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 6px;
    }

    .content {
      padding: 14px 16px 16px 16px;
    }

    /* Toggle Cards */
    .toggle-card {
      background: var(--bg);
      border: 3px solid var(--border);
      padding: 10px 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .toggle-card.paused {
      border-color: #FFA500;
    }
    .toggle-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .toggle-label-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      background: #008000;
      border: 2px solid var(--border);
      flex-shrink: 0;
    }
    .status-dot.paused {
      background: #FFA500;
    }
    .toggle-title {
      font-size: 11px;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
    }
    .toggle-desc {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.3;
    }

    /* RawBlock Rectangular Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--bg);
      border: 2px solid var(--border);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text);
    }
    input:checked + .slider {
      background-color: var(--text);
    }
    input:checked + .slider:before {
      transform: translateX(22px);
      background-color: var(--bg);
    }

    /* Due Card */
    .due-card {
      background: var(--bg);
      border: 3px solid var(--border);
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .due-label {
      font-size: 10px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .due-number {
      font-family: 'Archivo Black', sans-serif;
      font-size: 26px;
      color: var(--text);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    /* Action Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 11px 12px;
      border: 3px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 8px;
      font-family: 'Archivo Black', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .btn:last-child {
      margin-bottom: 0;
    }
    .btn-primary {
      background: var(--text);
      color: var(--bg);
    }
    .btn-primary:hover {
      background: var(--bg);
      color: var(--text);
    }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: var(--text);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">PACED LEARNER</div>
    <div class="header-right">
      <div class="subtitle">FSRS // PACEY</div>
      <button type="button" class="theme-toggle-btn" id="popup-theme-toggle" title="Toggle Dark Mode (Invert B&W + Pacey)">◐ DARK</button>
    </div>
  </div>

  <!-- Interactive Pacey Mascot Stage -->
  <div class="pacey-hero">
    <div class="pacey-avatar-cell" id="popup-pacey-stage" title="Click Pacey to switch expression • Double-click for 3D Orbit">
      <span class="corner-tick tick-tl">+</span>
      <span class="corner-tick tick-tr">+</span>
      <span class="corner-tick tick-bl">3D</span>
      <span class="corner-tick tick-br">OBS</span>
      <div id="popup-pacey-canvas"></div>
    </div>
    <div class="pacey-readout-cell">
      <div>
        <span class="pacey-badge" id="popup-pacey-badge">PACEY // ATTENTIVE</span>
        <div class="pacey-msg" id="popup-pacey-msg">&gt; OBSERVING LEETCODE SOLVES &amp; ERRORS.</div>
      </div>
      <div class="pacey-hint">[CLICK PACEY TO INTERACT]</div>
    </div>
  </div>

  <div class="content">
    <!-- Extension Master Toggle -->
    <div class="toggle-card" id="toggle-card">
      <div class="toggle-info">
        <div class="toggle-label-row">
          <div class="status-dot" id="status-dot"></div>
          <span class="toggle-title" id="status-title">OBSERVER: ACTIVE</span>
        </div>
        <div class="toggle-desc" id="status-desc">
          Pacey tracks editor actions, errors &amp; solves
        </div>
      </div>
      <label class="switch" title="Toggle LeetCode Pacey observer on or off">
        <input type="checkbox" id="extension-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Auto-Log on Solved Toggle -->
    <div class="toggle-card" id="autolog-card">
      <div class="toggle-info">
        <div class="toggle-label-row">
          <span class="toggle-title" id="autolog-title">AUTO-LOG: ON</span>
        </div>
        <div class="toggle-desc" id="autolog-desc">
          Instant sync on Accepted without modal prompt
        </div>
      </div>
      <label class="switch" title="Toggle instant auto-logging on Accepted">
        <input type="checkbox" id="autolog-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Due Reviews Today -->
    <div class="due-card">
      <div class="due-label">RECALL QUEUE DUE TODAY</div>
      <div class="due-number" id="due-count">0</div>
    </div>

    <button class="btn btn-primary" id="open-hub-btn">
      OPEN PACED LEARNER HUB
    </button>

    <button class="btn btn-secondary" id="open-leetcode-btn">
      OPEN LEETCODE PROBLEMS
    </button>
  </div>

  <script src="pacey-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
